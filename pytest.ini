[pytest]
testpaths = tests
# Pasta temporaria dos testes dentro do projeto (ignorada pelo git): a pasta Temp do Windows pode negar
# acesso (visto em 28/10/2026: 244 testes com PermissionError em AppData\Local\Temp\pytest-of-<usuario>).
# Cada execucao usa a sua subpasta (.pytest_tmp/exec-<pid>, ver tests/conftest.py): duas rodadas ao mesmo tempo nao se apagam.
# Em paralelo (pytest-xdist, 13/11/2026): rapida "pytest -m \"not lento\" -n 8" (~30 s desde 26/11/2026); completa "pytest -n 8" (~8 min; sem -n: ~30 min).
addopts = --basetemp=.pytest_tmp
# Testes que renderizam vídeo de verdade com o ffmpeg (lentos). Rápida: pytest -m "not lento"; completa: pytest
markers =
    lento: renderiza ou decodifica vídeo de verdade com o ffmpeg (fica na suíte completa)
    config_real: o teste PRECISA ler o config.toml real da raiz (raro; diga o motivo no teste)

